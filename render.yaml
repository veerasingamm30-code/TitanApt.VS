# Render Blueprint for TitanApt (existing project — infrastructure only).
# The web service serves the built React SPA and the API from one Node process.
# Migrations and the idempotent seed run in the start command because
# preDeployCommand requires a paid compute plan.

services:
  - type: web
    name: titanapt
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # prisma migrate deploy only applies committed, non-destructive migrations.
    # prisma/seed.ts is idempotent and preserves existing users and data.
    startCommand: npx prisma migrate deploy && npx tsx prisma/seed.ts && node apps/api/dist/index.js
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: titanapt-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: titanapt-db
    databaseName: titanapt_db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
